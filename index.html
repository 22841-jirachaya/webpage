<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scrapbook Journal - Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Prompt:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="custom-cursor"></div>

    <!-- Navigation Menu -->
    <nav class="navbar">
        <div class="nav-brand">✨ MY JOURNAL</div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn active">Cover</a></li>
            <li><a href="profile.html" class="nav-btn">Profile</a></li>
            <li><a href="education.html" class="nav-btn">Education</a></li>
            <li><a href="hobby.html" class="nav-btn">Hobbies</a></li>
            <li><a href="contact.html" class="nav-btn">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="scrapbook-container">
        <section class="page-section">
            <div class="journal-cover tilt-card">
                <div class="tape tape-top-left"></div>
                <div class="tape tape-top-right"></div>
                <div class="badge-sticker">TOP SECRET 🔒</div>
                <h1 class="cover-title">MEMORIES & DREAMS</h1>
                <p class="cover-subtitle">ยินดีต้อนรับสู่ไดอารี่สุดอลังการของฉัน 🎨✨</p>
                <div class="sticker-group">
                    <span class="draggable-sticker">🎀</span>
                    <span class="draggable-sticker">⭐</span>
                    <span class="draggable-sticker">🌸</span>
                </div>
                <br><br>
                <a href="profile.html" class="cta-btn">OPEN DIARY 📖</a>
            </div>
        </section>
    </main>

    <script>
        // Custom Cursor & Sparkle Effects
        const cursor = document.querySelector('.custom-cursor');
        const sparkles = ['✨', '⭐', '🌸', '💖', '💫'];

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            if (Math.random() < 0.2) {
                const sparkle = document.createElement('span');
                sparkle.classList.add('sparkle');
                sparkle.innerText = sparkles[Math.floor(Math.random() * sparkles.length)];
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                sparkle.style.setProperty('--dx', (Math.random() - 0.5) * 60 + 'px');
                sparkle.style.setProperty('--dy', (Math.random() - 0.5) * 60 + 'px');
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000);
            }
        });

        // 3D Tilt Card
        document.querySelectorAll('.tilt-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        });
    </script>
</body>
</html>
